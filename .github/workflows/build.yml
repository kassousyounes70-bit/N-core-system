name: Build NCore Native Engine APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do not request the legacy "tools" package: it was removed from the
          # SDK repository, which made setup-android fail with exit code 1.
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # Pin the NDK explicitly. Never rely on whatever the runner happens to ship.
      - name: Install pinned NDK and CMake
        run: yes | sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Export NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Android NDK Project Structure
        env:
          # Optional: set this repo secret so the app and encoder share a stable key.
          NCORE_MASTER_KEY: ${{ secrets.NCORE_MASTER_KEY }}
        run: python generate_project.py

      # Materialise the wrapper so `./gradlew` is real and reproducible.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (minified + native)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NCore-Native-Engine-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
