name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept licenses and install SDK packages, NDK and CMake
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: python3 generate_project.py

      - name: Fetch bundled vendor libraries and fonts
        run: python3 tools/fetch_assets.py

      - name: Verify bundled assets
        run: |
          test -f app/src/main/assets/vendor/three.min.js
          test -f app/src/main/assets/vendor/jspdf.umd.min.js
          test -f app/src/main/assets/vendor/jszip.min.js
          test -f app/src/main/assets/vendor/potrace.js
          test -f app/src/main/assets/vendor/mp4-muxer.min.js
          test -f app/src/main/assets/fonts/fonts.css
          ls -la app/src/main/assets/vendor
          ls -la app/src/main/assets/fonts | head

      - name: Build release and debug APKs
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: html-protector-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: html-protector-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
